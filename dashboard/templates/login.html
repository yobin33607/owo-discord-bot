<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Limey — Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #ff0000;
            --red-dim: rgba(255, 0, 0, 0.4);
            --red-faint: rgba(255, 0, 0, 0.08);
            --red-glow: rgba(255, 0, 0, 0.6);
            --bg: #050000;
            --panel: rgba(10, 0, 0, 0.92);
            --text: #ffe0e0;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Outfit', sans-serif;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--sans);
        }


        #bgCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }


        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.07) 2px,
                    rgba(0, 0, 0, 0.07) 4px);
        }


        .wrapper {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 48px 40px 44px;
            background: var(--panel);
            border: 1px solid var(--red-dim);
            position: relative;
            transition: border-color 0.6s ease, box-shadow 0.6s ease;
        }

        .card::before,
        .card::after,
        .card .corner-br,
        .card .corner-bl {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--red);
            border-style: solid;
        }

        .card::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .card::after {
            top: -1px;
            right: -1px;
            border-width: 2px 2px 0 0;
        }

        .card .corner-br {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        .card .corner-bl {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 2px 2px;
        }


        .card__title {
            font-family: var(--mono);
            font-size: clamp(1.3rem, 4vw, 1.75rem);
            font-weight: 600;
            color: var(--red);
            text-shadow: 0 0 8px var(--red-glow);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 10px;
            min-height: 2.2rem;
        }

        .card__title .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--red);
            margin-left: 3px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }


        .card__sub {
            font-family: var(--mono);
            font-size: 0.7rem;
            color: rgba(255, 60, 60, 0.5);
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 38px;
        }

        .error-msg {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: #ff5555;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 18px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .field {
            position: relative;
            margin-bottom: 34px;
        }

        .field input {
            width: 100%;
            padding: 14px 0 8px;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 0, 0, 0.3);
            color: #fff;
            font-family: var(--sans);
            font-size: 1rem;
            outline: none;
            caret-color: var(--red);
            transition: border-color 0.3s ease;
        }

        .field label {
            position: absolute;
            left: 0;
            top: 14px;
            font-family: var(--mono);
            font-size: 0.9rem;
            color: rgba(255, 80, 80, 0.6);
            letter-spacing: 1px;
            pointer-events: none;
            transition: top 0.25s cubic-bezier(0.25, 0.8, 0.25, 1),
                font-size 0.25s cubic-bezier(0.25, 0.8, 0.25, 1),
                color 0.25s ease;
        }


        .field input:focus+label,
        .field input:not(:placeholder-shown)+label {
            top: -6px;
            font-size: 0.68rem;
            color: var(--red);
            text-shadow: 0 0 6px rgba(255, 0, 0, 0.5);
        }

        .field input:focus {
            border-bottom-color: var(--red);
            box-shadow: 0 6px 8px -6px rgba(255, 0, 0, 0.4);
        }

        /* ── auth button ── */
        #loginBtn {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: var(--red);
            color: #fff;
            border: none;
            font-family: var(--mono);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            /* smooth all transitions */
            transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.15s cubic-bezier(0.4, 0, 0.2, 1),
                color 0.2s ease;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
        }

        #loginBtn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0);
            transition: background 0.15s ease;
        }

        #loginBtn:hover {
            background: #ff2a2a;
            box-shadow: 0 0 28px rgba(255, 0, 0, 0.6);
        }

        #loginBtn:active {
            transform: scale(0.96);
            background: #c50000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        #loginBtn:active::after {
            background: rgba(255, 255, 255, 0.06);
        }

        .card.success {
            border-color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.2), inset 0 0 30px rgba(0, 255, 136, 0.04);
        }

        .card.success .card__title {
            color: #00ff88;
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.8);
        }

        .card.success::before,
        .card.success::after,
        .card.success .corner-br,
        .card.success .corner-bl {
            border-color: #00ff88;
        }

        #loginBtn.success-btn {
            background: #00c86e;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            color: #000;
        }

        /* ── snake animation for error ── */
        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-8px);
            }

            40% {
                transform: translateX(8px);
            }

            60% {
                transform: translateX(-5px);
            }

            80% {
                transform: translateX(5px);
            }
        }

        .card.shake {
            animation: shake 0.4s ease;
        }

        /* ── oauth message ── */
        .oauth-msg {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: #ff5555;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 18px;
            display: none;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
        }
        .oauth-msg.success {
            color: #00ff88;
        }

        /* ── divider ── */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0 20px;
            color: rgba(255, 80, 80, 0.4);
            font-family: var(--mono);
            font-size: 0.75rem;
            letter-spacing: 2px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 0, 0, 0.15);
        }
        .divider span {
            padding: 0 14px;
        }

        /* ── discord login button ── */
        .discord-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px;
            background: #5865F2;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-family: var(--sans);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
            box-shadow: 0 0 16px rgba(88, 101, 242, 0.3);
        }
        .discord-btn:hover {
            background: #4752c4;
            box-shadow: 0 0 24px rgba(88, 101, 242, 0.5);
        }
        .discord-btn:active {
            transform: scale(0.97);
        }
        .discord-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36"><path fill="%23ffffff" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>') no-repeat center;
            background-size: contain;
        }

        .passkey-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23ffffff" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5Zm-3 5a3 3 0 1 1 6 0v3H9V6Zm3 7a2 2 0 0 1 1 3.73V18h2v2h-2v-2h-2v-1.27A2 2 0 0 1 12 13Z"/></svg>') no-repeat center;
            background-size: contain;
        }

        #passkeyBtn:hover {
            background: #1c1c1c;
            box-shadow: 0 0 24px rgba(255, 0, 0, 0.3);
        }

        .ext-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%2300ff88" d="M9 7V3m6 4V3M7 7h10v4a5 5 0 0 1-5 5 5 5 0 0 1-5-5V7Zm5 9v5"/></svg>') no-repeat center;
            background-size: contain;
        }

        #extLoginBtn:hover {
            background: #123322;
            box-shadow: 0 0 24px rgba(0, 255, 136, 0.35);
        }

        /* ── responsive ── */
        @media (max-width: 480px) {
            .card {
                padding: 36px 24px 32px;
            }

            .card__title {
                letter-spacing: 2px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 28px 18px 26px;
            }
        }

        @media (min-width: 1200px) {
            .card {
                max-width: 440px;
            }
        }
    </style>
</head>

<body>

    <canvas id="bgCanvas"></canvas>

    <div class="wrapper">
        <div class="card" id="card">
            <span class="corner-br"></span>
            <span class="corner-bl"></span>

            <h1 class="card__title" id="heading"><span class="cursor" id="cur"></span></h1>
            <p class="card__sub">SECURE ACCESS</p>                <div class="error-msg" id="error-display"></div>
                <div class="oauth-msg" id="oauth-msg-display"></div>

            <form id="loginForm">
                <div class="field">
                    <input type="text" id="username" placeholder=" " required autocomplete="username">
                    <label for="username">Username</label>
                </div>
                <div class="field">
                    <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                    <label for="password">Password</label>
                </div>
                <button type="submit" id="loginBtn">Authenticate</button>
            </form>

            <button type="button" id="passkeyBtn" class="discord-btn" style="background:#111; border:1px solid rgba(255,0,0,0.3); box-shadow:0 0 16px rgba(255,0,0,0.15); margin-top:6px;">
                <span class="passkey-icon"></span>
                Sign in with Passkey
            </button>

            <button type="button" id="extLoginBtn" class="discord-btn" style="display:none; background:#0d1b12; border:1px solid rgba(0,255,136,0.35); box-shadow:0 0 16px rgba(0,255,136,0.12); margin-top:6px;">
                <span class="ext-icon"></span>
                Sign in with Extension
            </button>
            <p id="extLoginHint" style="display:none; font-family:var(--mono); font-size:0.72rem; color:rgba(0,255,136,0.6); text-align:center; margin-top:6px; letter-spacing:1px;">
                Extension detected — link it in My Account to enable this.
            </p>

            <div class="divider"><span>or</span></div>

            <a href="/api/auth/discord/login" id="discordLoginBtn" class="discord-btn">
                <span class="discord-icon"></span>
                Login with Discord
            </a>

            <!-- 2FA step (shown after correct password when 2FA is enabled) -->
            <div id="twofa-section" style="display:none;">
                <p class="card__sub" style="margin-bottom:18px;">2FA VERIFICATION</p>
                <div class="field">
                    <input type="text" id="twofa-code" placeholder=" " inputmode="numeric" autocomplete="one-time-code"
                           onkeydown="if(event.key==='Enter'){submit2fa();}">
                    <label for="twofa-code">6-Digit Code</label>
                </div>
                <button type="button" id="twofaBtn" onclick="submit2fa()">Verify Code</button>
                <p style="font-family:var(--mono); font-size:0.7rem; color:rgba(255,80,80,0.5); text-align:center; margin-top:14px; letter-spacing:1px;">
                    No authenticator? Use a backup code instead.
                </p>
                <button type="button" id="backToLoginBtn" onclick="backToPasswordLogin()"
                        style="width:100%; margin-top:8px; padding:10px; background:transparent; border:1px solid rgba(255,0,0,0.25); color:#ff7777; font-family:var(--mono); font-size:0.75rem; letter-spacing:2px; cursor:pointer;">
                    ← Back to password login
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/extension_bridge.js"></script>
    <script>
        // ─── OAuth flash messages ─────────────────────────
        (function() {
            const errEl = document.getElementById('error-display');
            const oauthEl = document.getElementById('oauth-msg-display');

            // Check URL params for OAuth messages from callback
            const params = new URLSearchParams(window.location.search);
            const oauthError = params.get('oauth_error') || '';
            const oauthSuccess = params.get('oauth_success') || '';

            if (oauthError) {
                oauthEl.textContent = decodeURIComponent(oauthError);
                oauthEl.className = 'oauth-msg error';
                oauthEl.style.display = 'block';
            } else if (oauthSuccess) {
                oauthEl.textContent = decodeURIComponent(oauthSuccess);
                oauthEl.className = 'oauth-msg success';
                oauthEl.style.display = 'block';
            }
        })();

        // ─── typing effect ─────────────────────────────────
        (function () {
            const text = "LIMEY AUTH";
            const el = document.getElementById('heading');
            const cursor = document.getElementById('cur');
            let i = 0;
            function tick() {
                if (i < text.length) {
                    el.insertBefore(document.createTextNode(text[i]), cursor);
                    i++;
                    setTimeout(tick, 80);
                }
            }
            tick();
        })();

        let successTriggered = false;

        function showError(msg) {
            const err = document.getElementById('error-display');
            const card = document.getElementById('card');
            err.textContent = msg;
            err.style.display = 'block';
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
        }

        function hideError() {
            document.getElementById('error-display').style.display = 'none';
        }

        function loginSuccess() {
            if (successTriggered) return;
            const card = document.getElementById('card');
            const btn = document.getElementById('loginBtn');
            card.classList.add('success');
            btn.textContent = "Access Granted";
            btn.classList.add('success-btn');
            btn.style.pointerEvents = "none";
            document.getElementById('passkeyBtn').style.pointerEvents = 'none';
            const extBtn = document.getElementById('extLoginBtn');
            if (extBtn) extBtn.style.pointerEvents = 'none';
            successTriggered = true;
            spawnLimeylLines();
            setTimeout(() => { window.location.href = '/dashboard'; }, 1900);
        }

        let extLoginAvailable = false;

        function showTwofaStep() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('passkeyBtn').style.display = 'none';
            document.getElementById('extLoginBtn').style.display = 'none';
            document.getElementById('extLoginHint').style.display = 'none';
            document.getElementById('discordLoginBtn').style.display = 'none';
            document.querySelector('.divider').style.display = 'none';
            document.getElementById('twofa-section').style.display = 'block';
            hideError();
            const code = document.getElementById('twofa-code');
            code.value = '';
            setTimeout(() => code.focus(), 50);
        }

        function backToPasswordLogin() {
            document.getElementById('twofa-section').style.display = 'none';
            document.getElementById('loginForm').style.display = '';
            document.getElementById('passkeyBtn').style.display = '';
            document.getElementById('extLoginBtn').style.display = extLoginAvailable ? '' : 'none';
            document.getElementById('discordLoginBtn').style.display = '';
            document.querySelector('.divider').style.display = '';
        }

        function submit2fa() {
            const code = document.getElementById('twofa-code').value.trim();
            const btn = document.getElementById('twofaBtn');
            if (!code) return;
            hideError();
            btn.textContent = "Verifying…";
            btn.style.pointerEvents = 'none';
            fetch('/api/auth/2fa/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            })
                .then(r => r.json())
                .then(data => {
                    btn.textContent = "Verify Code";
                    btn.style.pointerEvents = 'auto';
                    if (data.success) {
                        loginSuccess();
                    } else {
                        showError(data.error || "Invalid code");
                    }
                })
                .catch(() => {
                    btn.textContent = "Verify Code";
                    btn.style.pointerEvents = 'auto';
                    showError("Connection Error");
                });
        }

        // On load: resume a password login that was waiting on its OTP.
        fetch('/api/auth/2fa/pending').then(r => r.json()).then(d => {
            if (d.pending) showTwofaStep();
        }).catch(() => {});

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.textContent = "Processing…";
            btn.style.pointerEvents = "none";
            hideError();

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        if (data.needs_2fa) {
                            btn.textContent = "Authenticate";
                            btn.style.pointerEvents = "auto";
                            showTwofaStep();
                        } else {
                            loginSuccess();
                        }
                    } else {
                        btn.textContent = "Authenticate";
                        btn.style.pointerEvents = "auto";
                        showError(data.error || "Invalid credentials");
                    }
                })
                .catch(() => {
                    btn.textContent = "Authenticate";
                    btn.style.pointerEvents = "auto";
                    showError("Connection Error");
                });
        });

        // ─── Passkey sign-in ─────────────────────────────
        function arrayBufToB64url(buf) {
            const bytes = new Uint8Array(buf);
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function credentialToJSON(cred) {
            if (cred.toJSON) return cred.toJSON();
            const r = {};
            if (cred.response.clientDataJSON) r.clientDataJSON = arrayBufToB64url(cred.response.clientDataJSON);
            if (cred.response.authenticatorData) r.authenticatorData = arrayBufToB64url(cred.response.authenticatorData);
            if (cred.response.signature) r.signature = arrayBufToB64url(cred.response.signature);
            if (cred.response.userHandle) r.userHandle = arrayBufToB64url(cred.response.userHandle);
            return { id: cred.id, rawId: arrayBufToB64url(cred.rawId), type: cred.type, response: r };
        }

        document.getElementById('passkeyBtn').addEventListener('click', async function () {
            if (!window.PublicKeyCredential) {
                showError("Passkeys are not supported in this browser.");
                return;
            }
            const u = document.getElementById('username').value.trim();
            const q = u ? '?username=' + encodeURIComponent(u) : '';
            hideError();
            const btn = document.getElementById('passkeyBtn');
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.6';
            try {
                const r = await fetch('/api/auth/passkey/options' + q);
                const data = await r.json();
                if (!data.success || !data.options) {
                    throw new Error(data.error || 'Passkey login unavailable');
                }
                const cred = await navigator.credentials.get({ publicKey: data.options });
                const vr = await fetch('/api/auth/passkey/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: credentialToJSON(cred) })
                });
                const vd = await vr.json();
                if (vd.success) {
                    loginSuccess();
                } else {
                    throw new Error(vd.error || 'Passkey verification failed');
                }
            } catch (e) {
                if (e.name === 'NotAllowedError') {
                    showError('Sign-in cancelled.');
                } else {
                    showError(e.message || 'Passkey sign-in failed');
                }
            } finally {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            }
        });

        // ─── Extension sign-in ─────────────────────────────
        document.getElementById('extLoginBtn').addEventListener('click', async function () {
            const btn = document.getElementById('extLoginBtn');
            hideError();
            btn.style.pointerEvents = 'none';
            btn.style.opacity = '0.6';
            try {
                const res = await window.limeyExtBridge.request('get', {}, 2000);
                if (!res || !res.ok || !res.credential) {
                    throw new Error('No extension credential found — link the extension in My Account first.');
                }
                const r = await fetch('/api/auth/extension/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: res.credential })
                });
                const d = await r.json();
                if (d.success) {
                    loginSuccess();
                } else {
                    throw new Error(d.error || 'Extension login failed');
                }
            } catch (e) {
                showError(e.message || 'Extension login failed');
            } finally {
                btn.style.pointerEvents = 'auto';
                btn.style.opacity = '1';
            }
        });

        // On load: if the extension is installed and holds a credential, offer
        // the "Sign in with Extension" button; otherwise show a gentle hint.
        (async function initExtensionLogin() {
            try {
                if (!window.limeyExtBridge) return;
                const installed = await window.limeyExtBridge.waitForInstalled(3000);
                if (!installed) return;
                const res = await window.limeyExtBridge.request('get', {}, 1500);
                const hint = document.getElementById('extLoginHint');
                if (res && res.ok && res.credential) {
                    extLoginAvailable = true;
                    document.getElementById('extLoginBtn').style.display = '';
                } else if (hint) {
                    hint.style.display = 'block';
                }
            } catch (e) { /* extension probing is best-effort */ }
        })();

        // ─── canvas ────────────────────────────────────────
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Dot {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * W;
                this.y = Math.random() * H;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.r = Math.random() * 1.5 + 0.5;
            }
            step() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > W) this.vx *= -1;
                if (this.y < 0 || this.y > H) this.vy *= -1;
            }
        }

        const DOTS = Array.from({ length: 55 }, () => new Dot());

        const limeyl = [];
        function spawnLimeylLines() {
            const cx = W / 2, cy = H / 2;
            const generators = [
                () => ({ sx: Math.random() * W, sy: 0 }),
                () => ({ sx: Math.random() * W, sy: H }),
                () => ({ sx: 0, sy: Math.random() * H }),
                () => ({ sx: W, sy: Math.random() * H }),
            ];
            for (let i = 0; i < 80; i++) {
                const g = generators[Math.floor(Math.random() * generators.length)]();
                const delay = i * 18;                         // stagger
                limeyl.push({
                    sx: g.sx, sy: g.sy,
                    cx: g.sx + (cx - g.sx) * (0.3 + Math.random() * 0.4),
                    cy: g.sy + (cy - g.sy) * (0.3 + Math.random() * 0.4),
                    tx: cx, ty: cy,
                    t: 0,
                    speed: 0.012 + Math.random() * 0.016,
                    delay,
                    elapsed: 0,
                    active: false,
                });
            }
        }

        let rafTime = 0;
        function drawLimeylLines(dt) {
            ctx.lineWidth = 1.2;
            limeyl.forEach(n => {
                n.elapsed += dt;
                if (n.elapsed < n.delay) return;
                if (!n.active) n.active = true;
                n.t = Math.min(n.t + n.speed, 1);
                const t = n.t;
                const ex = (1 - t) * (1 - t) * n.sx + 2 * (1 - t) * t * n.cx + t * t * n.tx;
                const ey = (1 - t) * (1 - t) * n.sy + 2 * (1 - t) * t * n.cy + t * t * n.ty;

                // trail line
                ctx.strokeStyle = `rgba(0, 255, 120, ${0.6 * (1 - t * 0.6)})`;
                ctx.beginPath();
                ctx.moveTo(n.sx, n.sy);
                ctx.quadraticCurveTo(n.cx, n.cy, ex, ey);
                ctx.stroke();

                // leading dot
                ctx.fillStyle = `rgba(0, 255, 120, ${1 - t * 0.4})`;
                ctx.beginPath();
                ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function loop(ts) {
            const dt = ts - rafTime;
            rafTime = ts;

            ctx.fillStyle = "rgba(5,0,0,0.22)";
            ctx.fillRect(0, 0, W, H);

            if (!successTriggered) {
                DOTS.forEach(d => d.step());
                for (let i = 0; i < DOTS.length; i++) {
                    for (let j = i + 1; j < DOTS.length; j++) {
                        const dx = DOTS[i].x - DOTS[j].x;
                        const dy = DOTS[i].y - DOTS[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 110) {
                            ctx.strokeStyle = `rgba(255,0,0,${(1 - dist / 110) * 0.35})`;
                            ctx.lineWidth = 0.5;
                            ctx.beginPath();
                            ctx.moveTo(DOTS[i].x, DOTS[i].y);
                            ctx.lineTo(DOTS[j].x, DOTS[j].y);
                            ctx.stroke();
                        }
                    }
                    ctx.fillStyle = "rgba(255,0,0,0.25)";
                    ctx.beginPath();
                    ctx.arc(DOTS[i].x, DOTS[i].y, DOTS[i].r, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                drawLimeylLines(dt);
            }

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(ts => { rafTime = ts; requestAnimationFrame(loop); });
    </script>
</body>

</html>
