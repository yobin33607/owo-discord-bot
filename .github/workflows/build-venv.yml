name: Build venv

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with the pre-built venvs?"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  build-venv:
    name: venv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: venv-linux
            venv-python: .venv/bin/python
          - os: macos-latest
            artifact-name: venv-macos
            venv-python: .venv/bin/python
          - os: windows-latest
            artifact-name: venv-windows
            venv-python: .venv\Scripts\python.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Upgrade pip
        run: ${{ matrix.venv-python }} -m pip install --upgrade pip --quiet

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            %LocalAppData%\pip\Cache
          key: pip-${{ matrix.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ matrix.os }}-

      - name: Install dependencies
        run: ${{ matrix.venv-python }} -m pip install -r requirements.txt --no-cache-dir

      - name: Verify venv
        run: |
          ${{ matrix.venv-python }} --version
          ${{ matrix.venv-python }} -c "import discord, flask, rich, aiohttp, requests; print('All imports OK')"

      - name: Package venv
        shell: bash
        run: |
          archive="venv-artifact"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${archive}.zip" .venv/
            echo "archive_name=${archive}.zip" >> $GITHUB_ENV
          else
            tar czf "${archive}.tar.gz" .venv/
            echo "archive_name=${archive}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: venv-artifact.*
          retention-days: 30
          if-no-files-found: error

  # ── Release (manual trigger only — avoids spam) ──
  release:
    name: 🚀 Release pre-built venvs
    if: github.event_name == 'workflow_dispatch' && inputs.create_release
    needs: [build-venv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all venv artifacts
        uses: actions/download-artifact@v4
        with:
          path: venv-artifacts/

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=venv-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          ls -la venv-artifacts/*/
          for dir in venv-artifacts/*/; do
            name=$(basename "$dir")
            cp "$dir"venv-artifact.* "release-assets/${name}.$(echo "$dir"venv-artifact.* | rev | cut -d. -f1 | rev)"
          done

      - name: Generate release notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Pre-built virtual environments

          Archives containing a fully-set-up `.venv` with all dependencies
          pre-installed for each platform.

          ### Quick start
          Pick your platform, download, extract into Limey project dir, then run:
          ```
          python limey.py
          ```

          ### Platforms
          | Archive | Platform |
          |---------|----------|
          | venv-linux.tar.gz | Linux (x86_64, Python 3.12) |
          | venv-macos.tar.gz | macOS (x86_64/arm64, Python 3.12) |
          | venv-windows.zip | Windows (x86_64, Python 3.12) |

          ---
          *Built by GitHub Actions — commit ${{ github.sha }}*
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pre-built venv ${{ steps.tag.outputs.tag }}"
          body_path: release-notes.md
          files: release-assets/*
          make_latest: false
