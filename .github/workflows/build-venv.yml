name: Build venv

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  build-venv:
    name: venv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-name: venv-linux
            venv-python: .venv/bin/python
            pip: .venv/bin/pip
          - os: macos-latest
            artifact-name: venv-macos
            venv-python: .venv/bin/python
            pip: .venv/bin/pip
          - os: windows-latest
            artifact-name: venv-windows
            venv-python: .venv\Scripts\python.exe
            pip: .venv\Scripts\pip.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          python -m venv .venv

      - name: Upgrade pip
        run: |
          ${{ matrix.venv-python }} -m pip install --upgrade pip --quiet

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.os }}-

      - name: Install dependencies
        run: |
          ${{ matrix.venv-python }} -m pip install -r requirements.txt --no-cache-dir

      - name: Verify venv
        run: |
          ${{ matrix.venv-python }} --version
          ${{ matrix.venv-python }} -c "import discord, flask, rich, aiohttp, requests; print('All imports OK')"

      - name: Package venv
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a -tzip venv-artifact.zip .venv/
          else
            tar czf venv-artifact.tar.gz .venv/
          fi

      - name: Upload venv artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: venv-artifact.*
          retention-days: 30
          if-no-files-found: error

  # ── Optional: create a combined release when pushed to main ──
  release:
    name: Release pre-built venvs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-venv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all venv artifacts
        uses: actions/download-artifact@v4
        with:
          path: venv-artifacts/

      - name: Create release tag
        id: tag
        run: |
          echo "tag=venv-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          cat > release-notes.md << 'EOF'
          ## Pre-built virtual environments

          These archives contain a fully-set-up `.venv` with all dependencies
          pre-installed for each platform.

          ### Usage
          1. Download the archive for your platform
          2. Extract it into your Limey project directory
          3. Run `python limey.py` (it'll auto-detect the venv)

          ### Platforms
          - **venv-linux** – x86_64 Linux (Python 3.12)
          - **venv-macos** – x86_64 / arm64 macOS (Python 3.12)
          - **venv-windows** – x86_64 Windows (Python 3.12)
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Pre-built venv ${{ steps.tag.outputs.tag }}"
          body_path: release-notes.md
          files: |
            venv-artifacts/venv-linux/venv-artifact.tar.gz
            venv-artifacts/venv-macos/venv-artifact.tar.gz
            venv-artifacts/venv-windows/venv-artifact.zip
          make_latest: false
